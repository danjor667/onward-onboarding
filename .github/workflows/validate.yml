name: validate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint pyyaml
      - name: Lint templates
        run: cfn-lint onboarding.yaml pipeline-roles.yaml
      - name: Enforce access rules
        run: python scripts/check_policy_rules.py onboarding.yaml pipeline-roles.yaml
