AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time bootstrap for Onward Logistics onboarding. Creates the role Git sync
  assumes and the scoped role CloudFormation uses to build the onboarding stack.
  Deploy once with the AWS CLI (see README). No inline policies.

Parameters:
  ProjectPrefix:
    Type: String
    Default: onward
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    Description: Must match ProjectPrefix in stack-config.yaml.
  ConnectionArn:
    Type: String
    AllowedPattern: "^arn:aws[a-z-]*:(codeconnections|codestar-connections):.+:connection/.+$"
    Description: ARN of the AWS CodeConnections connection to the GitHub repository.

Resources:
  # ---------------------------------------------------------------------------
  # Role assumed by Git sync to create and execute change sets.
  # ---------------------------------------------------------------------------
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectPrefix}-gitsync-role
      Path: !Sub /${ProjectPrefix}/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CfnGitSyncTrustPolicy
            Effect: Allow
            Principal: { Service: cloudformation.sync.codeconnections.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Ref ConnectionArn

  GitSyncPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectPrefix}-gitsync-policy
      Path: !Sub /${ProjectPrefix}/
      Roles: [!Ref GitSyncRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SyncToCloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:ListChangeSets
              - cloudformation:ListStacks
              - cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: PolicyForManagedRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
            Resource: "*"
            Condition:
              StringEquals:
                events:ManagedBy: cloudformation.sync.codeconnections.amazonaws.com
          - Sid: PolicyForDescribingRule
            Effect: Allow
            Action: events:DescribeRule
            Resource: "*"
          - Sid: PassOnlyTheExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com

  # ---------------------------------------------------------------------------
  # Role CloudFormation uses to build the onboarding stack. Scoped to the
  # project's IAM path, secret names and audit resources, and it can only
  # attach the approved managed policies.
  # ---------------------------------------------------------------------------
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectPrefix}-cfn-execution-role
      Path: !Sub /${ProjectPrefix}/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CloudFormationExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectPrefix}-cfn-execution-policy
      Path: !Sub /${ProjectPrefix}/
      Roles: [!Ref CloudFormationExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadIam
            Effect: Allow
            Action:
              - iam:Get*
              - iam:List*
            Resource: "*"
          - Sid: ManageProjectUsersGroupsPolicies
            Effect: Allow
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:UpdateUser
              - iam:TagUser
              - iam:UntagUser
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:DeleteLoginProfile
              - iam:AddUserToGroup
              - iam:RemoveUserFromGroup
              - iam:DeleteUserPermissionsBoundary
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:UpdateGroup
              - iam:DetachGroupPolicy
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${ProjectPrefix}/*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:group/${ProjectPrefix}/*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ProjectPrefix}/*
          - Sid: SetOnlyProjectBoundaries
            Effect: Allow
            Action: iam:PutUserPermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${ProjectPrefix}/*
            Condition:
              ArnLike:
                iam:PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ProjectPrefix}/boundaries/*
          - Sid: AttachOnlyApprovedPolicies
            Effect: Allow
            Action: iam:AttachGroupPolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:group/${ProjectPrefix}/*
            Condition:
              ArnEquals:
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2FullAccess
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ReadOnlyAccess
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/IAMUserChangePassword
          - Sid: ManageOnboardingSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectPrefix}/onboarding/*
          - Sid: GeneratePasswords
            Effect: Allow
            Action:
              - secretsmanager:GetRandomPassword
              - secretsmanager:ListSecrets
            Resource: "*"
          - Sid: ManageAuditBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucket*
              - s3:PutBucket*
              - s3:DeleteBucketPolicy
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
            Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectPrefix}-audit-*
          - Sid: ManageAuditTrail
            Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:StartLogging
              - cloudtrail:StopLogging
              - cloudtrail:GetTrail
              - cloudtrail:GetTrailStatus
              - cloudtrail:GetEventSelectors
              - cloudtrail:PutEventSelectors
              - cloudtrail:AddTags
              - cloudtrail:RemoveTags
              - cloudtrail:ListTags
            Resource: !Sub arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/${ProjectPrefix}-*
          - Sid: DescribeTrails
            Effect: Allow
            Action: cloudtrail:DescribeTrails
            Resource: "*"

Outputs:
  GitSyncRoleArn:
    Description: Choose this role as the Git sync IAM role.
    Value: !GetAtt GitSyncRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Choose this role as the stack's CloudFormation service role.
    Value: !GetAtt CloudFormationExecutionRole.Arn
